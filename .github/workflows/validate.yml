name: Validate repository configuration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON templates
        run: |
          jq empty config/amazon-cloudwatch-agent.json
          jq empty dashboards/cloudwatch-dashboard-template.json
      - name: Validate shell syntax
        run: |
          bash -n scripts/validate-config.sh
          bash -n scripts/deploy-dashboard.sh
      - name: Run local configuration checks
        run: bash scripts/validate-config.sh

      - name: Validate dashboard dry run
        run: bash scripts/deploy-dashboard.sh --dry-run ec2-monitoring-dashboard i-0123456789abcdef0 eu-central-1
