AWSTemplateFormatVersion: '2010-09-09'
Description: Three cost-aware CloudWatch alarms for one EC2 instance and an existing confirmed SNS topic.
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  SnsTopicArn:
    Type: String
  CpuThreshold:
    Type: Number
    Default: 80
  MemoryThreshold:
    Type: Number
    Default: 85
  DiskThreshold:
    Type: Number
    Default: 90
Resources:
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Average CPU utilization is high for one five-minute period.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref CpuThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]
  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CloudWatch Agent reports high memory utilization for one five-minute period.
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref MemoryThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]
  HighDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CloudWatch Agent reports high root-disk utilization for one five-minute period.
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref DiskThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]

