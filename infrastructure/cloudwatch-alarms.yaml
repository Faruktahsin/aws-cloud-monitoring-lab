AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Three cost-aware CloudWatch alarms for one EC2 instance and an existing confirmed SNS topic.
  The memory and root-disk alarms also notify when the CloudWatch Agent stops reporting.
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  SnsTopicArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$'
    ConstraintDescription: Must be the ARN of an existing standard SNS topic.
  CpuThreshold:
    Type: Number
    Default: 80
  MemoryThreshold:
    Type: Number
    Default: 85
  DiskThreshold:
    Type: Number
    Default: 90
Resources:
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Average CPU utilization is high for one five-minute period.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref CpuThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]
  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CloudWatch Agent reports high memory utilization for one five-minute period.
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref MemoryThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Agent metrics: missing data means the Agent, its role, or the host stopped reporting.
      # Leave it missing so the alarm moves to INSUFFICIENT_DATA and notifies, instead of
      # staying OK while the guest is unobserved (notBreaching would hide that).
      TreatMissingData: missing
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]
      InsufficientDataActions: [!Ref SnsTopicArn]
  HighDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CloudWatch Agent reports high root-disk utilization for one five-minute period.
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref DiskThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Agent metrics: missing data means the Agent, its role, or the host stopped reporting.
      # Leave it missing so the alarm moves to INSUFFICIENT_DATA and notifies, instead of
      # staying OK while the guest is unobserved (notBreaching would hide that).
      TreatMissingData: missing
      AlarmActions: [!Ref SnsTopicArn]
      OKActions: [!Ref SnsTopicArn]
      InsufficientDataActions: [!Ref SnsTopicArn]

